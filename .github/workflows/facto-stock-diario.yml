name: Actualizar stock Facto diario

on:
  schedule:
    - cron: '17 0 * * *'
      timezone: 'America/Santiago'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facto-stock-diario
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
      - name: Verificar lector y sincronización
        run: node --test scripts/facto-stock.test.mjs scripts/facto-sync.test.mjs scripts/stock-ui.test.mjs
      - name: Consultar stock de los SKU del CSV
        env:
          FACTO_CLIENT_ID: ${{ secrets.FACTO_CLIENT_ID }}
          FACTO_CLIENT_SECRET: ${{ secrets.FACTO_CLIENT_SECRET }}
          FACTO_USERNAME: ${{ secrets.FACTO_USERNAME }}
          FACTO_PASSWORD: ${{ secrets.FACTO_PASSWORD }}
        run: node scripts/facto-sync.mjs
      - name: Guardar stock público
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Webprecios/files/stock-facto.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar stock diario de Facto"
          git pull --rebase origin master
          git push origin HEAD:master
          echo "Archivo de stock publicado correctamente." >> "$GITHUB_STEP_SUMMARY"

